# ExcelRouter Skill — WorkBuddy 技能市场元信息
# 上架 SkillHub (skillhub.cn) 时，本文件内容可直接"抄"到网页端发布表单。
# slug 为市场 URL 标识，固定小写 + 连字符。
# 注意：version 跟随上游桌面版（本 skill 的 vendor/core 与桌面版同一套代码）。

name: excelrouter
# 名字必须把目标关键词放到**最开头**（实测 2026-09-10）：
#   SkillHub 搜索只看 display_name 的字面连续匹配，description/tags 都不参与；
#   且「开头命中」权重极高（竞品 144 下载就能压 118 万下载的热门），
#   「中间命中」几乎不加分（连续子串存在但被品牌前缀顶到第 15 字以后 → 0 分）。
# 所以品牌 ExcelRouter 退到末尾，把 excel拆分/表格拆分/PDF加密分发 放最前面。
display_name: Excel拆分、表格拆分、PDF加密分发助手 — ExcelRouter
version: "2.9.2"
slug: excelrouter
description: >
  把总表交给 AI，说清楚「按什么拆」，就拆好还给你。常用场景：
  工资条拆分、绩效表拆分——一人一份，拆完直接发到个人；
  按部门拆分 Excel——一个部门一个文件（按区域、网格、工号、班级、门店拆也一样）；
  一人一份 Excel——工资条、成绩单、提成表、报销明细都这么发；
  Excel 批量加密分发——一批表一次拆完，不同表里同一个人的行自动合并；
  PDF 按名单设密码——每份一个专属密码 + 可溯源水印，外泄能查到是谁。
  保留原表格式；一张表、一整批表都能拆。全程本地处理，数据不出本机、不上传。
  与免费 Windows 桌面版同一内核，介绍与下载：https://marsandsea.github.io/ExcelRouter/
category: productivity
triggers:
  - "按部门拆表"
  - "把这个表按区域拆分"
  - "分表"
  - "每个人一个文件"
  - "按班级拆分"
