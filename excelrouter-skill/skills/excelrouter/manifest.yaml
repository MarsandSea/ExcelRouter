# ExcelRouter Skill — WorkBuddy 技能市场元信息
# 上架 SkillHub (skillhub.cn) 时，本文件内容可直接"抄"到网页端发布表单。
# slug 为市场 URL 标识，固定小写 + 连字符。
# 注意：version 跟随上游桌面版（本 skill 的 vendor/core 与桌面版同一套代码）。

name: excelrouter
# 名字必须把目标关键词放到**最开头**（实测 2026-09-10）：
#   SkillHub 搜索只看 display_name 的字面连续匹配，description/tags 都不参与；
#   且「开头命中」权重极高（竞品 144 下载就能压 118 万下载的热门），
#   「中间命中」几乎不加分（连续子串存在但被品牌前缀顶到第 15 字以后 → 0 分）。
# 所以品牌 ExcelRouter 退到末尾，把 excel拆分/表格拆分/PDF加密分发 放最前面。
# 2026-10-11（v2.10.1 技能接入汇总 / 查收）复测 skillhub.cn 网页搜索（按 score 排）后更正上面一条：
# 网页版中段命中也算分——旧名里第 9 字的「表格拆分」排第 2、第 14 字的「PDF加密」排第 3；
# 「中段几乎不加分」只在 WorkBuddy 客户端搜索里观察到。所以已排上的词一个不丢：
# 开头「Excel拆分」不动，「拆分合并」「表格拆分」「拆分汇总」「PDF加密分发」都是连续子串。
# 「excel合并」「表格汇总」不在名字里连续出现，靠 description 里的「多个 Excel 合并成一个、表格汇总」被网页搜索读到。
# 显示名不写「文件加密」：丢掉已排第 3 的「PDF加密」，又像通用加密软件；Word/Excel/PPT 也能加密写在描述里。
display_name: Excel拆分合并、表格拆分汇总、PDF加密分发 — ExcelRouter
version: "3.0.0"
slug: excelrouter
description: >
  发出去、收回来都交给 AI。拆分——总表按任意字段拆成多个文件：工资条、绩效表一人一份，
  按部门拆分 Excel 一个部门一个文件，一批表也能一次拆完；
  汇总——多个 Excel 合并成一个、表格汇总：一个文件夹里同一套模板的表、或一个文件的多个 sheet 合成一张，按列名对齐，
  列顺序不同、多一列少一列都不错位，每行标明来自谁，各表的合计行不重复合进来；
  查收——表发下去让大家填，收回来几秒查出谁没交、谁交了空表、哪一列漏了第几行，
  写好可以直接发群的通报和逐人催办；
  文件加密分发——PDF / Word / Excel 按名单设专属打开密码，PDF 再加可溯源水印。
  保留原表格式，全程本地处理，数据不出本机、不上传。
  与免费 Windows 桌面版同一内核，介绍与下载：https://marsandsea.github.io/ExcelRouter/
