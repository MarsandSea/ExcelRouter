name: 一次性 / 修复 Gitee 占位仓库可见性

# 用途：检查并修正 excel-router 占位仓库的 public/private 与 README。
# 跑完即删本文件。

on:
  workflow_dispatch:

jobs:
  stub:
    runs-on: ubuntu-latest
    steps:
      - name: 检查并设为公开
        env:
          GITEE_TOKEN: ${{ secrets.GITEE }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.error, urllib.parse, urllib.request

          TOKEN = os.environ["GITEE_TOKEN"]
          API = "https://gitee.com/api/v5"
          OWNER, NAME = "marsandsea", "excel-router"
          BASE = f"{API}/repos/{OWNER}/{NAME}"

          def call(method, url, data=None):
              body = None
              if method == "GET":
                  url = f"{url}?{urllib.parse.urlencode({'access_token': TOKEN})}"
              else:
                  body = urllib.parse.urlencode({**(data or {}), "access_token": TOKEN}).encode()
              req = urllib.request.Request(url, data=body, method=method)
              try:
                  with urllib.request.urlopen(req) as r:
                      return r.status, json.loads(r.read().decode() or "{}")
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()[:400]

          code, repo = call("GET", BASE)
          print("GET", code)
          if code == 200:
              keys = ("full_name", "path", "private", "public", "permission",
                      "has_issues", "has_wiki", "can_comment", "empty_repo",
                      "default_branch", "description")
              print(json.dumps({k: repo.get(k) for k in keys}, ensure_ascii=False, indent=1))

          # 显式设为公开
          code, res = call("PATCH", BASE, {
              "private": "false",
              "name": NAME,
              "description": "旧地址占位：仓库已更名为 ExcelRouter（本仓库不含代码，仅作跳转）",
          })
          print("PATCH private=false ->", code, str(res)[:400])

          code, repo = call("GET", BASE)
          if code == 200:
              print("AFTER private =", repo.get("private"), "| public =", repo.get("public"),
                    "| default_branch =", repo.get("default_branch"))
          PY

      - name: 复核 README
        env:
          GITEE_TOKEN: ${{ secrets.GITEE }}
        run: |
          code=$(curl -s -o /tmp/rd.md -w "%{http_code}" -L \
            "https://gitee.com/marsandsea/excel-router/raw/master/README.md")
          echo "raw README HTTP ${code}"
          head -3 /tmp/rd.md || true
