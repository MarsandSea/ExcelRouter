[pytest]
# 不带路径的 `pytest -q`（本机和 release.yml）只收桌面版的 tests/。
# 技能测试单独跑：py -m pytest -q excelrouter-skill/skills/excelrouter/tests
# 原因：技能测试把 scripts/vendor 插到 sys.path 最前，又先于 tests/ 被收集，同一进程里
# 后面的桌面版测试 import 到的会是 vendor 里上次发版的旧 core——新加的模块报 ImportError，
# 其余的则在悄悄测旧代码。publish-skill.yml 本来就只跑技能那一份。
testpaths = tests
